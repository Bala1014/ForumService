name: Production Deploy

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: racingglazing-510419
  REGION: asia-south1
  SERVICE: forumservice
  AR_REPO: raceservice   # artrifact repository name

jobs:
  deploy-prod:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: |
          gcloud auth configure-docker $REGION-docker.pkg.dev

      - name: Build Docker Image
        run: |
          docker build \
            -t $REGION-docker.pkg.dev/$PROJECT_ID/$AR_REPO/$SERVICE:${GITHUB_SHA} .

      - name: Push Docker Image
        run: |
          docker push \
            $REGION-docker.pkg.dev/$PROJECT_ID/$AR_REPO/$SERVICE:${GITHUB_SHA}

      - name: Deploy Production Service
        run: |
          gcloud run deploy $SERVICE \
            --image $REGION-docker.pkg.dev/$PROJECT_ID/$AR_REPO/$SERVICE:${GITHUB_SHA} \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --add-cloudsql-instances racingglazing:asia-south1:raceservice-postgres \
            --set-env-vars ConnectionStrings__ForumDatabase="Host=/cloudsql/racingglazing:asia-south1:raceservice-postgres;Database=forumservice;Username=forumserviceuser;Password=${{ secrets.POSTGRES_PASSWORD }}"

      - name: Get Production URL
        id: prod-url
        run: |
          URL=$(gcloud run services describe $SERVICE \
            --region=$REGION \
            --format='value(status.url)')

          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Health Check
        run: |
          URL=${{ steps.prod-url.outputs.url }}

          for i in {1..20}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/health/ready")

            if [ "$STATUS" = "200" ]; then
              echo "Production deployment healthy"
              exit 0
            fi

            sleep 10
          done

          echo "Production deployment unhealthy"
          exit 1