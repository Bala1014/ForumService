services:
  postgres:
    image: postgres:16-alpine
    container_name: forumservice-postgres
    environment:
      POSTGRES_DB: forumservice
      POSTGRES_USER: forum
      POSTGRES_PASSWORD: forum
    ports:
      - "5432:5432"
    volumes:
      - forum_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forum -d forumservice"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  forum_pgdata:
